name: secret-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OpenRouter secrets
        env:
          K1: ${{ secrets.OPEN_ROUTER_API_KEY }}
          K2: ${{ secrets.OPEN_ROUTER_API_KEY_2 }}
        run: |
          fp() { printf '%s' "$1" | sha256sum | cut -c1-16; }
          echo "K1 len=${#K1} fp=$(fp "$K1")"
          echo "K2 len=${#K2} fp=$(fp "$K2")"
          for n in K1 K2; do
            if [ "$n" = "K1" ]; then k="$K1"; else k="$K2"; fi
            resp=$(curl -s -m 10 -H "Authorization: Bearer $k" https://openrouter.ai/api/v1/key)
            rem=$(printf '%s' "$resp" | jq -r '.data.free_model_daily_requests.remaining // "missing"')
            used=$(printf '%s' "$resp" | jq -r '.data.free_model_daily_requests.used // "missing"')
            echo "$n: remaining=$rem used=$used"
          done